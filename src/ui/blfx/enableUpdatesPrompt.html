<div class="eskie-world-scripts-container eskie-blfx-enable-updates-dialog" style="padding: 10px;">
    <div style="display: flex; gap: 14px; align-items: flex-start; margin-bottom: 16px;">
        <div style="font-size: 2.2rem; color: #a78bfa; line-height: 1; flex-shrink: 0;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div>
            <h3 style="margin: 0 0 8px 0; font-weight: 600; color: #f1f5f9; font-size: 1rem;">
                {{localize "EMP.blfxPrompt.enableUpdatesHeading"}}
            </h3>
            <p style="margin: 0 0 8px 0; font-size: 0.88rem; color: #cbd5e1; line-height: 1.45;">
                {{localize "EMP.blfxPrompt.enableUpdatesMessage"}}
            </p>
            <p style="margin: 0; font-size: 0.82rem; color: #94a3b8; line-height: 1.4;">
                <strong>Instructions:</strong> {{localize "EMP.blfxPrompt.instructions"}}
            </p>
        </div>
    </div>

    <footer class="eskie-world-scripts-footer eskie-aa-button-row" style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 12px;">
        <button type="button" name="openSettings" class="eskie-btn-primary">
            <i class="fa-solid fa-gear"></i> {{localize "EMP.blfxPrompt.openSettings"}}
        </button>
        <button type="button" name="dismiss" class="eskie-btn-secondary">
            <i class="fa-solid fa-xmark"></i> {{localize "EMP.blfxPrompt.dismiss"}}
        </button>
    </footer>
</div>
